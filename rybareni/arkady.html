<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Restip Neděle</title>
<link rel="stylesheet" href="arkady.css"></head><body>
<div id="pub"><svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs>
<pattern id="wp" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#541a19"/><path d="M20 6l7 14-7 14-7-14z" fill="#67231f"/></pattern>
<pattern id="wd" width="34" height="12" patternUnits="userSpaceOnUse"><rect width="34" height="12" fill="#6a3d1d"/><rect width="2" height="12" fill="#3f220d"/></pattern>
<pattern id="fl" width="80" height="26" patternUnits="userSpaceOnUse"><rect width="80" height="26" fill="#8a5a2b"/><path d="M0 0H80M40 0V13M0 13H80" stroke="#5a3515" stroke-width="2"/></pattern>
<radialGradient id="cn" cx="50%" cy="0%" r="100%"><stop offset="0" stop-color="#ffd98a" stop-opacity=".5"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
<radialGradient id="vg" cx="50%" cy="50%" r="75%"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
<filter id="gl" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
<g id="bt"><rect x="-6" y="-26" width="12" height="26" rx="3"/><rect x="-2.5" y="-42" width="5" height="18"/></g>
<g id="mg"><rect x="-14" y="-30" width="28" height="30" rx="4" fill="#f2b632"/><rect x="-14" y="-38" width="28" height="10" rx="5" fill="#fff"/><path d="M14-24h8q6 0 6 8t-6 8h-8" fill="none" stroke="#f2b632" stroke-width="4"/></g>
<g id="lp"><path d="M0 0V60" stroke="#222" stroke-width="3"/><path d="M-36 102L-14 60H14L36 102Z" fill="#1f6b43"/><ellipse cx="0" cy="102" rx="36" ry="6" fill="#ffe9a8"/></g>
</defs>
<rect width="1000" height="700" fill="url(#wp)"/><rect y="372" width="1000" height="200" fill="url(#wd)"/><rect y="366" width="1000" height="10" fill="#2f190b"/><rect y="572" width="1000" height="128" fill="url(#fl)"/>
<g id="lamps"><path d="M134 104L30 500H310L206 104Z" fill="url(#cn)" transform="translate(0,0)"/><path d="M464 104L360 560H640L536 104Z" fill="url(#cn)"/><path d="M794 104L690 500H970L866 104Z" fill="url(#cn)"/>
<use href="#lp" x="170"/><use href="#lp" x="500"/><use href="#lp" x="830"/></g>
<g class="neon" font-family="Impact,'Arial Black',sans-serif" font-size="52" text-anchor="middle"><text x="150" y="190" fill="#ff3d7f" filter="url(#gl)">HOSPODA</text><text x="150" y="190" fill="none" stroke="#ffd1e3" stroke-width="2.5">HOSPODA</text>
<text x="850" y="450" font-size="40" fill="#35d6ff" filter="url(#gl)">PIVO</text><text x="850" y="450" font-size="40" fill="none" stroke="#d6f6ff" stroke-width="2">PIVO</text></g>
<rect x="20" y="254" width="260" height="8" fill="#3b2110"/><rect x="20" y="330" width="260" height="8" fill="#3b2110"/>
<g><use href="#bt" x="50" y="254" fill="#2e8b57"/><use href="#bt" x="82" y="254" fill="#8b4513"/><use href="#bt" x="114" y="254" fill="#c9a227"/><use href="#bt" x="146" y="254" fill="#2e8b57"/><use href="#bt" x="178" y="254" fill="#6a1b9a"/><use href="#bt" x="210" y="254" fill="#b71c1c"/><use href="#bt" x="242" y="254" fill="#1565c0"/>
<use href="#mg" x="60" y="330"/><use href="#mg" x="110" y="330"/><use href="#mg" x="190" y="330"/><use href="#mg" x="240" y="330"/></g>
<circle cx="740" cy="130" r="38" fill="#3b2110"/><circle cx="740" cy="130" r="32" fill="#f3ead2"/><path d="M740 130V106M740 130L756 138" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<g transform="translate(870,250)"><circle r="64" fill="#1a1a1a"/><circle r="54" fill="#e8d9a0"/><circle r="38" fill="#c1272d"/><circle r="26" fill="#e8d9a0"/><circle r="13" fill="#1b7a3b"/><circle r="5" fill="#c1272d"/><path d="M-70-10L-8-2M60-50L4-8" stroke="#ddd" stroke-width="3"/></g>
<rect x="0" y="470" width="250" height="102" fill="#4a2a12"/><rect x="0" y="462" width="262" height="14" fill="#9a6a34"/><use href="#mg" x="70" y="462"/><use href="#mg" x="130" y="462"/><use href="#mg" x="200" y="462"/>
<ellipse cx="880" cy="520" rx="44" ry="10" fill="#7a1f1f"/><rect x="872" y="520" width="16" height="50" fill="#333"/><path d="M846 590L880 568L914 590" stroke="#333" stroke-width="5" fill="none"/>
<rect width="1000" height="700" fill="url(#vg)"/></svg>
</div>
<div class="cab"><div class="sign"><h1>RESTIP NEDĚLE</h1><div class="demo">Zkušební hra – žádné skutečné peníze</div></div>
<div class="stage"><div class="machine" id="mach"><div class="bulbs" id="b1"></div>
<div class="reels"><div class="reel"></div><div class="reel"></div><div class="reel"></div><div class="line"></div></div>
<div class="bulbs" id="b2" style="margin:10px 4px 0"></div></div>
<div class="lever" id="lev"><div class="ball"></div><div class="stick"></div><div class="base"></div></div></div>
<div class="hud"><div class="box"><small>ZŮSTATEK</small><b id="bal"></b></div>
<div class="box"><small>SÁZKA</small><div class="bet"><button id="m">−</button><b id="bet"></b><button id="p">+</button></div></div>
<div class="box"><small>POSLEDNÍ VÝHRA</small><b id="win">0</b></div><div class="box" id="fbox" style="display:none"><small>ZDARMA</small><b id="fr"></b></div></div>
<div class="tray"></div><div class="plate">Zatáhni za páku nebo stiskni mezerník</div></div>
<div class="legs"><i></i><i></i></div>
<div id="banner"></div><div id="fx"></div>
<button id="bub">💬</button><div id="bbox"><input id="pw" placeholder="napiš zprávu…" autocomplete="off"></div>
<div id="admin"><h2>🔧 Admin panel</h2>
<div class="row"><input id="amt" type="number" value="10000"><button onclick="addM(+$('amt').value)">Přidat peníze</button></div>
<div class="row"><button onclick="addM(1000)">+1 000</button><button onclick="addM(100000)">+100 000</button><button onclick="bal=1000;upd()">Reset</button></div>
<h3>Vyzkoušet efekt výhry</h3>
<div class="row"><button onclick="tw(2500)">2 500 🪙</button><button onclick="tw(5000)">5 000 ✈️</button><button onclick="tw(10000)">10 000 tanky</button><button onclick="tw(20000)">20 000 mrakodrap</button></div>
<div class="row"><button onclick="startBonus()">🃏 Spustit bonus</button><button onclick="$('admin').classList.remove('on')">Zavřít</button></div></div>
<script src="tokeny.js"></script>
<script src="arkady.js"></script></body></html>
